name: Feature request
description: Propose a new capability
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: principle
    attributes:
      label: Which principle does this advance?
      options:
        - Honesty over hype
        - Multinational-product polish
        - Community health
        - Other
    validations:
      required: true